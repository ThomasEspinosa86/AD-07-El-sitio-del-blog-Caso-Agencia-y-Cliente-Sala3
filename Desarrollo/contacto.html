<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contáctenos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <nav>
            <a href="index.html">Volver al inicio</a>
        </nav>
    </header>

    <main>
        <h1>Contáctenos</h1>
        <p>¿Tienes alguna pregunta o comentario? Completa el siguiente formulario para ponerte en contacto con nosotros.</p>

        <form action="#" method="POST">
            <div>
                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>

            <div>
                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div>
                <label for="asunto">Asunto:</label>
                <input type="text" id="asunto" name="asunto" required>
            </div>

            <div>
                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" name="mensaje" rows="5" required></textarea>
            </div>

            <button type="submit">Enviar mensaje</button>
        </form>

        <section>
            <h2>Información de contacto</h2>
            <ul>
                <li><strong>Ubicación:</strong> Bogotá, Colombia</li>
                <li><strong>Correo:</strong> sala3blogamer@hotmail.com</li>
                <li><strong>Teléfono:</strong> +57 300 345 6535</li>
            </ul>
        </section>
    </main>

    <footer>
        <p>&copy; fork.</p>
    </footer>

</body>
</html>
